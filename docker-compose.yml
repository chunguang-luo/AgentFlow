services:
  backend:
    build:
      context: ./backend
    environment:
      AGENTFLOW_ENV: production
      AGENTFLOW_DB_PATH: /data/agentflow/agentflow.db
      AGENTFLOW_WORKSPACE_ROOT: /data/agentflow/workspaces
      AGENTFLOW_ARTIFACT_ROOT: /data/agentflow/artifacts
      AGENTFLOW_LOG_LEVEL: INFO
    volumes:
      - agentflow-data:/data/agentflow
    ports:
      - '8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '5173:80'
    restart: unless-stopped

volumes:
  agentflow-data:
